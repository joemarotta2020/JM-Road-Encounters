name: One-shot SSS biological female source fix

on:
  push:
    branches:
      - fix/sss-biological-female-20261009

permissions:
  contents: write

jobs:
  patch-source:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sss-biological-female-20261009
          fetch-depth: 0

      - name: Patch canonical DLL source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.cpp')
          s = p.read_text()

          anchor = '''            return Eligibility::IsHumanoidSSSCandidateRace(\n                hasNPC, hasCreature, hasAnimal);\n        }\n\n        float DistanceSquared'''
          replacement = '''            return Eligibility::IsHumanoidSSSCandidateRace(\n                hasNPC, hasCreature, hasAnimal);\n        }\n\n        bool IsSSSBiologicalFemaleCandidate(RE::Actor* a_actor)\n        {\n            auto* base = a_actor ? a_actor->GetActorBase() : nullptr;\n            const int baseSex = base ? static_cast<int>(base->GetSex()) : -1;\n            return Eligibility::IsBiologicalFemaleSSSCandidate(\n                base != nullptr, baseSex);\n        }\n\n        float DistanceSquared'''
          assert anchor in s, 'helper insertion anchor missing'
          s = s.replace(anchor, replacement, 1)

          old = '''                a_actor->IsDead() || a_actor->IsDisabled() ||\n                !a_actor->Is3DLoaded() || !IsSSSHumanoidCandidate(a_actor)) {'''
          new = '''                a_actor->IsDead() || a_actor->IsDisabled() ||\n                !a_actor->Is3DLoaded() || !IsSSSHumanoidCandidate(a_actor) ||\n                !IsSSSBiologicalFemaleCandidate(a_actor)) {'''
          assert old in s, 'exact classifier gate anchor missing'
          s = s.replace(old, new, 1)

          old = '''            if (!IsSSSHumanoidCandidate(a_actor)) {\n                return { -1, "fallback", "non-humanoid-race" };\n            }\n\n            // Acquisition classification is deliberately explicit and cheap.'''
          new = '''            if (!IsSSSHumanoidCandidate(a_actor)) {\n                return { -1, "fallback", "non-humanoid-race" };\n            }\n            if (!IsSSSBiologicalFemaleCandidate(a_actor)) {\n                return { -1, "fallback", "biological-male-or-unknown" };\n            }\n\n            // Acquisition classification is deliberately explicit and cheap.'''
          assert old in s, 'detailed classifier sex gate anchor missing'
          s = s.replace(old, new, 1)

          old = '''            std::int32_t rejectedSpecies = 0;\n            std::int32_t rejectedChild = 0;'''
          new = '''            std::int32_t rejectedSpecies = 0;\n            std::int32_t rejectedBiologicalSex = 0;\n            std::int32_t rejectedChild = 0;'''
          assert old in s, 'rejection counter anchor missing'
          s = s.replace(old, new, 1)

          old = '''                } else if (reason == "non-humanoid-race") {\n                    ++rejectedSpecies;\n                } else if (reason == "child") {'''
          new = '''                } else if (reason == "non-humanoid-race") {\n                    ++rejectedSpecies;\n                } else if (reason == "biological-male-or-unknown") {\n                    ++rejectedBiologicalSex;\n                } else if (reason == "child") {'''
          assert old in s, 'rejection reason anchor missing'
          s = s.replace(old, new, 1)

          old = '''                    "(tested={}, invalid={}, species={}, child={}, teammate={}, "\n                    "combat={}, hostile={}, cannotTalk={}, radius={:.0f})",\n                    scan,\n                    tested,\n                    rejectedInvalid,\n                    rejectedSpecies,\n                    rejectedChild,'''
          new = '''                    "(tested={}, invalid={}, species={}, biologicalSex={}, child={}, teammate={}, "\n                    "combat={}, hostile={}, cannotTalk={}, radius={:.0f})",\n                    scan,\n                    tested,\n                    rejectedInvalid,\n                    rejectedSpecies,\n                    rejectedBiologicalSex,\n                    rejectedChild,'''
          assert old in s, 'diagnostic summary anchor missing'
          s = s.replace(old, new, 1)

          old = '''            if (!a_actor || !IsSSSHumanoidCandidate(a_actor)) {\n                return false;\n            }'''
          new = '''            if (!a_actor || !IsSSSHumanoidCandidate(a_actor) ||\n                !IsSSSBiologicalFemaleCandidate(a_actor)) {\n                return false;\n            }'''
          assert old in s, 'dialogue verification gate anchor missing'
          s = s.replace(old, new, 1)

          # Structural invariant: female gate must occur before bandit/guard/general returns.
          detail_start = s.index('SSSClassificationResult ClassifySSSWhoringActorDetailed')
          detail_end = s.index('bool IsSSSWhoringPackageActiveImpl', detail_start)
          detail = s[detail_start:detail_end]
          assert detail.index('IsSSSBiologicalFemaleCandidate') < detail.index('BanditFaction')
          assert detail.index('IsSSSBiologicalFemaleCandidate') < detail.index('IsGuard()')
          assert detail.index('IsSSSBiologicalFemaleCandidate') < detail.index('general-client')

          p.write_text(s)
          PY

      - name: Remove one-shot workflow and commit canonical source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-sss-sex-fix.yml
          git add src/main.cpp
          git commit -m "Fix SSS biological male acquisition regression"
          git push origin HEAD:fix/sss-biological-female-20261009
