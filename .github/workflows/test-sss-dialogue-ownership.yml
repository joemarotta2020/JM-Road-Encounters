name: Test SSS Dialogue Ownership

on:
  push:
    branches:
      - feature/sss-whoring-exclusions
  workflow_dispatch:

jobs:
  regression:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC x64
        uses: TheMrMilchmann/setup-msvc-dev@v4.0.0
        with:
          arch: x64
      - name: Compile dialogue ownership regression test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build\tests | Out-Null
          cl /nologo /std:c++20 /EHsc tests\SSSDialogueOwnershipTests.cpp /Fe:build\tests\SSSDialogueOwnershipTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'SSS dialogue ownership regression compile failed.' }
          .\build\tests\SSSDialogueOwnershipTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'SSS dialogue ownership regression test failed.' }
