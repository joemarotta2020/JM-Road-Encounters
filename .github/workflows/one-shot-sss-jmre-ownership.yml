name: One-shot SSS JM RE dialogue ownership fix

on:
  push:
    branches:
      - fix/sss-jmre-ownership-plrp-flavor

permissions:
  contents: write

jobs:
  patch-source:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sss-jmre-ownership-plrp-flavor
          fetch-depth: 0

      - name: Patch canonical DLL source
        run: python tools/patch_sss_jmre_ownership.py

      - name: Commit canonical source and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-sss-jmre-ownership.yml
          git rm tools/patch_sss_jmre_ownership.py
          git add src/main.cpp src/SSSEligibilityPolicy.h
          git commit -m "Prevent SSS cooldown during JM RE force-greet"
          git push origin HEAD:fix/sss-jmre-ownership-plrp-flavor
