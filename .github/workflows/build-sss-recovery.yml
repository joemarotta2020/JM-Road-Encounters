name: Build SSS Recovery

on:
  push:
    branches:
      - recovery/sss-prefeature-exclusion-only
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-se:
    name: Skyrim SE 1.5.97 SSS recovery
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal recovery patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/apply_sss_recovery.py src/main.cpp
          if ($LASTEXITCODE -ne 0) { throw 'SSS recovery source patch failed.' }

      - name: Test recovery source invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tests/test_sss_recovery_invariants.py
          if ($LASTEXITCODE -ne 0) { throw 'SSS recovery invariant test failed.' }

      - name: Audit canonical JM RE source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/audit_jm_re.py .
          if ($LASTEXITCODE -ne 0) { throw 'JM RE production invariant audit failed.' }

      - name: Set up MSVC x64
        uses: TheMrMilchmann/setup-msvc-dev@v4.0.0
        with:
          arch: x64

      - name: Test SSS exclusion parser
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build\tests | Out-Null
          cl /nologo /std:c++20 /EHsc tests\SSSExclusionConfigTests.cpp /Fe:build\tests\SSSExclusionConfigTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'SSS exclusion parser compile failed.' }
          .\build\tests\SSSExclusionConfigTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'SSS exclusion parser tests failed.' }

      - name: Prepare vcpkg
        shell: pwsh
        run: |
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          C:\vcpkg\vcpkg.exe version

      - name: Configure release
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build release DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build --config Release --target JM_RoadEncounters -- /m
          if ($LASTEXITCODE -ne 0) { throw 'JM_RoadEncounters DLL build failed.' }

      - name: Prepare Caprica Papyrus toolchain
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .github\Caprica | Out-Null
          gh release download 0.3.0a -R KrisV-777/Caprica --pattern "Caprica.zip" --dir .github --clobber
          7z x .github\Caprica.zip "-o.github\Caprica" -y
          if (-not (Test-Path ".github\Caprica\Caprica.exe")) { throw 'Caprica.exe not found after extraction.' }

          New-Item -ItemType Directory -Force -Path .github\Papyrus | Out-Null
          foreach ($sourceName in @('SRC', 'SRC_SKYUI', 'SRC_PAPUTIL')) {
            $target = ".github\Papyrus\$sourceName"
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Push-Location $target
            git init
            git remote add origin https://github.com/IHateMyKite/PAPYRUS.git
            git sparse-checkout set --no-cone $sourceName
            git fetch --depth=1 origin main
            git checkout main
            Remove-Item .git -Recurse -Force
            Pop-Location
          }

          $flagsTemp = '.github\Papyrus\flags-temp'
          New-Item -ItemType Directory -Force -Path $flagsTemp | Out-Null
          Push-Location $flagsTemp
          git init
          git remote add origin https://github.com/Rukan/Grimy-Skyrim-Papyrus-Source.git
          git sparse-checkout set --no-cone TESV_Papyrus_Flags.flg
          git fetch --depth=1 origin master
          git checkout master
          Copy-Item TESV_Papyrus_Flags.flg ..\SRC\TESV_Papyrus_Flags.flg
          Pop-Location
          Remove-Item $flagsTemp -Recurse -Force

      - name: Compile pre-feature SSS controller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $corePath = 'papyrus\JM_RE_Core.psc'
          $coreText = Get-Content $corePath -Raw
          $coreText = $coreText.Replace('Int JM_RE_ForceGreetCategory = CATEGORY_NONE', 'Int JM_RE_ForceGreetCategory = 0')
          Set-Content -Path $corePath -Value $coreText -Encoding utf8
          New-Item -ItemType Directory -Force -Path build\papyrus | Out-Null
          .github\Caprica\Caprica.exe --game skyrim --import ".github/Papyrus/SRC;.github/Papyrus/SRC_SKYUI;.github/Papyrus/SRC_PAPUTIL;papyrus;" --output "build/papyrus" --flags=".github/Papyrus/SRC/TESV_Papyrus_Flags.flg" "${{ github.workspace }}/papyrus" -R -q
          if (-not (Test-Path 'build\papyrus\JM_SSS_WhoringController.pex')) { throw 'JM_SSS_WhoringController.pex was not produced.' }

      - name: Verify binaries contain recovery behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Get-ChildItem -Path build -Recurse -File -Filter 'JM_RoadEncounters.dll' | Select-Object -First 1
          if (-not $dll) { throw 'JM_RoadEncounters.dll was not produced.' }
          $exports = (& dumpbin /nologo /exports $dll.FullName) -join "`n"
          foreach ($required in @('SKSEPlugin_Load', 'SKSEPlugin_Query', 'SKSEPlugin_Version')) {
            if ($exports -notmatch [regex]::Escape($required)) { throw "Missing required SKSE export: $required" }
          }

          $dllAscii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($dll.FullName))
          foreach ($required in @('JM_RoadEncounters.ini', 'SSSWhoringExclusions', 'SSS exclusion active:', 'SSS exclusion config loaded:')) {
            if (-not $dllAscii.Contains($required)) { throw "DLL missing recovery string: $required" }
          }
          foreach ($forbidden in @('accepted SSS dialogue by authoritative package fallback', 'SSS_Whoring startup reconciliation')) {
            if ($dllAscii.Contains($forbidden)) { throw "DLL still contains regressed behavior: $forbidden" }
          }

          $pex = 'build\papyrus\JM_SSS_WhoringController.pex'
          $pexAscii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($pex))
          if (-not $pexAscii.Contains('live SSS dialogue verified for actor=')) { throw 'PEX does not contain pre-feature commit path.' }
          if ($pexAscii.Contains('waiting for original SSS acceptance fragment')) { throw 'PEX contains later broken wait-for-fragment behavior.' }

          Get-FileHash $dll.FullName -Algorithm SHA256 | Format-List
          Get-FileHash $pex -Algorithm SHA256 | Format-List

      - name: Commit canonical recovery source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.cpp
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Restore pre-feature SSS behavior with in-memory exclusions'
            git push origin HEAD:recovery/sss-prefeature-exclusion-only
          } else {
            Write-Host 'Canonical recovery source already committed.'
          }

      - name: Stage recovery artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifact\SKSE\Plugins | Out-Null
          New-Item -ItemType Directory -Force -Path artifact\Scripts | Out-Null
          New-Item -ItemType Directory -Force -Path artifact\Source\Scripts | Out-Null
          New-Item -ItemType Directory -Force -Path artifact\Source\JM-Road-Encounters\src | Out-Null

          $dll = Get-ChildItem -Path build -Recurse -File -Filter 'JM_RoadEncounters.dll' | Select-Object -First 1
          Copy-Item $dll.FullName artifact\SKSE\Plugins\JM_RoadEncounters.dll
          Copy-Item config\JM_RoadEncounters.ini artifact\SKSE\Plugins\JM_RoadEncounters.ini
          Copy-Item build\papyrus\JM_SSS_WhoringController.pex artifact\Scripts\JM_SSS_WhoringController.pex
          Copy-Item papyrus\JM_SSS_WhoringController.psc artifact\Source\Scripts\JM_SSS_WhoringController.psc
          Copy-Item src\main.cpp artifact\Source\JM-Road-Encounters\src\main.cpp
          Copy-Item src\SSSExclusionConfig.h artifact\Source\JM-Road-Encounters\src\SSSExclusionConfig.h

          $dllHash = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash
          $pexHash = (Get-FileHash build\papyrus\JM_SSS_WhoringController.pex -Algorithm SHA256).Hash
          "Recovery baseline commit: edea94e124068e89cd7231d48d05a454e76bbe37" | Set-Content artifact\BUILD_INFO.txt
          "DLL SHA256: $dllHash" | Add-Content artifact\BUILD_INFO.txt
          "Controller PEX SHA256: $pexHash" | Add-Content artifact\BUILD_INFO.txt
          "Runtime guard: Skyrim SE 1.5.97 only" | Add-Content artifact\BUILD_INFO.txt
          "Architecture: pre-feature SSS behavior plus in-memory-only configurable exclusions" | Add-Content artifact\BUILD_INFO.txt
          "No FLST dependency; no dialogue ownership fallback; no SSS startup reconciliation" | Add-Content artifact\BUILD_INFO.txt

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: JM-SSS-Recovery-SE-1.5.97
          path: artifact/
          if-no-files-found: error
          retention-days: 30
