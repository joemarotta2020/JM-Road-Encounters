name: Promote JM RE v6 Canonical Core

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-core-v6.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify complete v6 Core
        run: |
          python .github/promote_jm_re_core_v6.py
          test "$(sha256sum papyrus/JM_RE_Core.psc | awk '{print $1}')" = "680b371d26679dec67ffd1f38e54e30c602b0f4999004c0a46340bd9da4e88b5"
          grep -q '^Int Function GetEncounterSpeakerPriority' papyrus/JM_RE_Core.psc
          grep -q '^Bool Function EvaluateNativeCandidatesIndexed' papyrus/JM_RE_Core.psc
          ! grep -q 'Bool Int Function' papyrus/JM_RE_Core.psc
          ! grep -q 'EndIfEndFunction' papyrus/JM_RE_Core.psc

      - name: Make normal build single-source and exhaustive
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-se.yml')
          s=p.read_text()
          start=s.find('      - name: Apply exact JM RE v5 force-greet source\n')
          end=s.find('      - name: Set up MSVC x64\n', start)
          if start >= 0 and end >= 0:
              s=s[:start]+s[end:]
          old='foreach ($required in @("JM_RE_Core.pex", "JM_RE_Native.pex", "JM_SSS_WhoringController.pex"))'
          new='foreach ($required in @("JM_RE_Core.pex", "JM_RE_Native.pex", "JM_RE_PLRPProvider.pex", "JM_RE_HydraProvider.pex", "JM_RE_ImmersiveWenchesProvider.pex", "JM_SSS_WhoringController.pex"))'
          if old in s:
              s=s.replace(old,new)
          p.write_text(s)
          PY
          ! grep -q 'apply_jm_re_forcegreet.py' .github/workflows/build-se.yml
          grep -q 'JM_RE_PLRPProvider.pex' .github/workflows/build-se.yml
          grep -q 'JM_RE_HydraProvider.pex' .github/workflows/build-se.yml
          grep -q 'JM_RE_ImmersiveWenchesProvider.pex' .github/workflows/build-se.yml

      - name: Audit complete source tree
        run: |
          python tools/audit_jm_re.py .
          test "$(sha256sum papyrus/JM_RE_Core.psc | awk '{print $1}')" = "680b371d26679dec67ffd1f38e54e30c602b0f4999004c0a46340bd9da4e88b5"

      - name: Remove obsolete source substitution machinery
        run: |
          rm -f .github/apply_jm_re_forcegreet.py
          rm -f .github/jm_re_payload_suffix.txt
          rm -f .github/workflows/compile-jm-re-core.yml
          rm -f .github/promote_jm_re_core_v6.py
          rm -f .github/core_v6_payload_1.txt .github/core_v6_payload_1b.txt .github/core_v6_payload_2.txt .github/core_v6_payload_3.txt .github/core_v6_payload_4.txt
          rm -f .github/core_v5_to_v6.patch
          rm -f .github/workflows/compile-v6-audit.yml
          rm -f .github/workflows/promote-core-v6.yml

      - name: Commit canonical source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Canonicalize audited JM RE v6 source"
          git push origin HEAD:main
