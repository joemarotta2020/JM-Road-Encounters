name: Build JM Road Encounters SE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-se:
    name: Skyrim SE 1.5.97
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact JM RE v5 force-greet source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $helperPath = '.github\apply_jm_re_forcegreet.py'
          $helperText = Get-Content $helperPath -Raw
          $needle = 'data = zlib.decompress(base64.b64decode(PAYLOAD))'
          $replacement = "PAYLOAD += Path('.github/jm_re_payload_suffix.txt').read_text().strip()`n$needle"
          if (-not $helperText.Contains($needle)) { throw 'Could not locate payload decode line.' }
          $helperText = $helperText.Replace($needle, $replacement)
          Set-Content -Path $helperPath -Value $helperText -Encoding utf8
          python $helperPath

      - name: Set up MSVC x64
        uses: TheMrMilchmann/setup-msvc-dev@v4.0.0
        with:
          arch: x64

      - name: Prepare vcpkg
        shell: pwsh
        run: |
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          C:\vcpkg\vcpkg.exe version

      - name: Configure release
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build release
        shell: pwsh
        run: |
          cmake --build build --config Release --target JM_RoadEncounters -- /m

      - name: Prepare Caprica Papyrus toolchain
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .github\Caprica | Out-Null
          gh release download 0.3.0a -R KrisV-777/Caprica --pattern "Caprica.zip" --dir .github --clobber
          7z x .github\Caprica.zip "-o.github\Caprica" -y
          if (-not (Test-Path ".github\Caprica\Caprica.exe")) { throw "Caprica.exe not found after extraction." }

          New-Item -ItemType Directory -Force -Path .github\Papyrus | Out-Null
          foreach ($sourceName in @("SRC", "SRC_SKYUI", "SRC_PAPUTIL")) {
            $target = ".github\Papyrus\$sourceName"
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Push-Location $target
            git init
            git remote add origin https://github.com/IHateMyKite/PAPYRUS.git
            git sparse-checkout set --no-cone $sourceName
            git fetch --depth=1 origin main
            git checkout main
            Remove-Item .git -Recurse -Force
            Pop-Location
          }

          $flagsTemp = ".github\Papyrus\flags-temp"
          New-Item -ItemType Directory -Force -Path $flagsTemp | Out-Null
          Push-Location $flagsTemp
          git init
          git remote add origin https://github.com/Rukan/Grimy-Skyrim-Papyrus-Source.git
          git sparse-checkout set --no-cone TESV_Papyrus_Flags.flg
          git fetch --depth=1 origin master
          git checkout master
          Copy-Item TESV_Papyrus_Flags.flg ..\SRC\TESV_Papyrus_Flags.flg
          Pop-Location
          Remove-Item $flagsTemp -Recurse -Force

      - name: Compile Papyrus sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $corePath = 'papyrus\JM_RE_Core.psc'
          $coreText = Get-Content $corePath -Raw
          $coreText = $coreText.Replace('Int JM_RE_ForceGreetCategory = CATEGORY_NONE', 'Int JM_RE_ForceGreetCategory = 0')
          Set-Content -Path $corePath -Value $coreText -Encoding utf8
          New-Item -ItemType Directory -Force -Path build\papyrus | Out-Null
          .github\Caprica\Caprica.exe --game skyrim --import ".github/Papyrus/SRC;.github/Papyrus/SRC_SKYUI;.github/Papyrus/SRC_PAPUTIL;papyrus;" --output "build/papyrus" --flags=".github/Papyrus/SRC/TESV_Papyrus_Flags.flg" "${{ github.workspace }}/papyrus" -R -q
          foreach ($required in @("JM_RE_Core.pex", "JM_RE_Native.pex", "JM_SSS_WhoringController.pex")) {
            if (-not (Test-Path "build\papyrus\$required")) { throw "Required Papyrus output missing: $required" }
          }

      - name: Verify SKSE plugin exports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Get-ChildItem -Path build -Recurse -File -Filter 'JM_RoadEncounters.dll' | Select-Object -First 1
          if (-not $dll) { throw 'JM_RoadEncounters.dll was not produced.' }
          $exports = (& dumpbin /nologo /exports $dll.FullName) -join "`n"
          $exports | Write-Host
          foreach ($required in @('SKSEPlugin_Load', 'SKSEPlugin_Query', 'SKSEPlugin_Version')) {
            if ($exports -notmatch [regex]::Escape($required)) {
              throw "Missing required SKSE export: $required"
            }
          }

      - name: Stage build artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifact\SKSE\Plugins | Out-Null
          New-Item -ItemType Directory -Force -Path artifact\Scripts | Out-Null
          New-Item -ItemType Directory -Force -Path artifact\Source\Scripts | Out-Null

          $dll = Get-ChildItem -Path build -Recurse -File -Filter 'JM_RoadEncounters.dll' | Select-Object -First 1
          if (-not $dll) { throw 'JM_RoadEncounters.dll was not produced.' }
          Copy-Item $dll.FullName artifact\SKSE\Plugins\JM_RoadEncounters.dll

          $pdb = Get-ChildItem -Path build -Recurse -File -Filter 'JM_RoadEncounters.pdb' | Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName artifact\SKSE\Plugins\JM_RoadEncounters.pdb }

          Copy-Item build\papyrus\*.pex artifact\Scripts\
          Copy-Item papyrus\*.psc artifact\Source\Scripts\

          "Source commit: $env:GITHUB_SHA" | Set-Content artifact\BUILD_INFO.txt
          "Runtime guard: Skyrim SE 1.5.97 only" | Add-Content artifact\BUILD_INFO.txt
          Get-ChildItem artifact -Recurse

      - name: Upload Skyrim SE build
        uses: actions/upload-artifact@v4
        with:
          name: JM-Road-Encounters-SE-1.5.97
          path: artifact/
          if-no-files-found: error
          retention-days: 30