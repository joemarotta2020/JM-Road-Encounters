name: Compile JM RE Core PEX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-core:
    name: Compile JM_RE_Core for Skyrim SE 1.5.97
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply exact JM RE v5 force-greet source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $helperPath = '.github\apply_jm_re_forcegreet.py'
          $helperText = Get-Content $helperPath -Raw
          $needle = 'data = zlib.decompress(base64.b64decode(PAYLOAD))'
          $replacement = "PAYLOAD += Path('.github/jm_re_payload_suffix.txt').read_text().strip()`n$needle"
          if (-not $helperText.Contains($needle)) { throw 'Could not locate payload decode line.' }
          $helperText = $helperText.Replace($needle, $replacement)
          Set-Content -Path $helperPath -Value $helperText -Encoding utf8
          python $helperPath

      - name: Verify exact source hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash papyrus\JM_RE_Core.psc -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'd7f56f6e5370ecafef100c3fea59b90196a4c26e8bfba4daf1e8fb651d7ca425') { throw "Unexpected JM_RE_Core.psc hash: $hash" }
          Write-Host "Verified source SHA256=$hash"

      - name: Prepare Caprica Papyrus toolchain
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .github\Caprica | Out-Null
          gh release download 0.3.0a -R KrisV-777/Caprica --pattern "Caprica.zip" --dir .github --clobber
          7z x .github\Caprica.zip "-o.github\Caprica" -y
          if (-not (Test-Path ".github\Caprica\Caprica.exe")) { throw "Caprica.exe not found after extraction." }

          New-Item -ItemType Directory -Force -Path .github\Papyrus | Out-Null
          foreach ($sourceName in @("SRC", "SRC_SKYUI", "SRC_PAPUTIL")) {
            $target = ".github\Papyrus\$sourceName"
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Push-Location $target
            git init
            git remote add origin https://github.com/IHateMyKite/PAPYRUS.git
            git sparse-checkout set --no-cone $sourceName
            git fetch --depth=1 origin main
            git checkout main
            Remove-Item .git -Recurse -Force
            Pop-Location
          }

          $flagsTemp = ".github\Papyrus\flags-temp"
          New-Item -ItemType Directory -Force -Path $flagsTemp | Out-Null
          Push-Location $flagsTemp
          git init
          git remote add origin https://github.com/Rukan/Grimy-Skyrim-Papyrus-Source.git
          git sparse-checkout set --no-cone TESV_Papyrus_Flags.flg
          git fetch --depth=1 origin master
          git checkout master
          Copy-Item TESV_Papyrus_Flags.flg ..\SRC\TESV_Papyrus_Flags.flg
          Pop-Location
          Remove-Item $flagsTemp -Recurse -Force

      - name: Compile JM RE Papyrus sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build\papyrus | Out-Null
          .github\Caprica\Caprica.exe --game skyrim --import ".github/Papyrus/SRC;.github/Papyrus/SRC_SKYUI;.github/Papyrus/SRC_PAPUTIL;papyrus;" --output "build/papyrus" --flags=".github/Papyrus/SRC/TESV_Papyrus_Flags.flg" "${{ github.workspace }}/papyrus/JM_RE_Core.psc" -q
          if (-not (Test-Path "build\papyrus\JM_RE_Core.pex")) { throw "JM_RE_Core.pex was not produced." }
          Get-FileHash build\papyrus\JM_RE_Core.pex -Algorithm SHA256

      - name: Stage PEX artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact\Scripts | Out-Null
          New-Item -ItemType Directory -Force -Path artifact\Source\Scripts | Out-Null
          Copy-Item build\papyrus\JM_RE_Core.pex artifact\Scripts\JM_RE_Core.pex
          Copy-Item papyrus\JM_RE_Core.psc artifact\Source\Scripts\JM_RE_Core.psc
          "Source SHA256: d7f56f6e5370ecafef100c3fea59b90196a4c26e8bfba4daf1e8fb651d7ca425" | Set-Content artifact\BUILD_INFO.txt
          "Target: Skyrim SE 1.5.97" | Add-Content artifact\BUILD_INFO.txt

      - name: Upload JM RE Core artifact
        uses: actions/upload-artifact@v4
        with:
          name: JM-RE-Core-ForceGreet-v5
          path: artifact/
          if-no-files-found: error
          retention-days: 30